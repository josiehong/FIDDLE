name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install black
        run: pip install black

      - name: Check formatting
        run: black --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
        include:
          # keep NumPy 1.x covered; the other jobs get NumPy 2
          - os: ubuntu-latest
            python: '3.10'
            numpy: '<2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[inference]" pytest "numpy${{ matrix.numpy }}"

      - name: Run tests
        run: pytest tests/ -v
